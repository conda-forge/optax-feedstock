{% set name = "optax" %}
{% set version = "0.2.9" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/optax-{{ version }}.tar.gz
  sha256: fcaa7e34c37ab2875c72d91e55374ff02a7ef6463b79fdb45bd3d65c6d4d61c5

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - python >={{ python_min }}
    - absl-py >=0.7.1
    - chex >=0.1.86
    - jax >=0.5.3
    - jaxlib >=0.5.3
    - numpy >=1.18.0
    - typing_extensions >=3.10
    - etils

test:
  imports:
    - optax
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}
    # Required by chex until it gets fixed upstream
    - setuptools

about:
  home: https://github.com/deepmind/optax
  summary: A gradient processing and optimisation library in JAX.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - flferretti
    - PhilipVinc
    - hbq1
